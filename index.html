<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>泡泡是梦 · 现场投屏</title>
<style>
  :root{
    --ink:#fdf8ff;
    --pink:#ff9ec7;
    --pink-d:#ff6fae;
    --blue:#8fd0ff;
    --blue-d:#6aa8ff;
    --yellow:#ffd88a;
    --yellow-d:#ffc247;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;margin:0;background:#050308;overflow:hidden;
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#050308;}

  /* ---------- 场景 ---------- */
  .scene{
    position:absolute;inset:0;opacity:0;visibility:hidden;
    transition:opacity .9s ease,visibility .9s;
    overflow:hidden;
  }
  .scene.active{opacity:1;visibility:visible;}
  /* 第五屏的残余延到第六屏，让新泡泡像是从里面长出来的 */
  .scene.linger{opacity:1;visibility:visible;pointer-events:none;transition:opacity 2.2s ease;}
  .scene.linger.fade{opacity:0;}
  .layer{position:absolute;inset:0;}
  /* 第六屏：新泡泡浮在暖光之上，别被灯晕糊掉 */
  .scene[data-i="5"] .layer.bl{z-index:3;}
  .scene[data-i="5"] .line::before{
    background:radial-gradient(ellipse at center,rgba(5,3,8,.62) 0%,rgba(5,3,8,.28) 46%,rgba(5,3,8,0) 74%);
  }

  /* 暗角 */
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:40;
    background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 100%);
  }

  /* ---------- 泡泡 ---------- */
  .b{position:absolute;will-change:transform;animation:rise var(--dur) var(--ease,linear) var(--delay) forwards;}
  .w{width:100%;height:100%;animation:sway var(--sway,9s) ease-in-out infinite alternate;animation-delay:var(--swayd,0s);}
  .bub{
    width:100%;height:100%;border-radius:50%;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 30% 22%,rgba(255,255,255,.75) 0%,rgba(255,255,255,.22) 8%,rgba(255,255,255,0) 22%),
      radial-gradient(circle at 70% 78%,var(--tint) 0%,rgba(255,255,255,0) 50%),
      radial-gradient(circle at 42% 36%,rgba(255,255,255,.15) 0%,rgba(255,255,255,.05) 36%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.30) 89%,rgba(255,255,255,.10) 100%);
    box-shadow:
      inset -8px -12px 34px -14px var(--tint),
      inset 0 0 50px rgba(255,255,255,.10),
      0 0 54px -14px var(--tint);
  }
  .bub::before{
    content:"";position:absolute;inset:-28%;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,var(--tint) 0%,rgba(255,255,255,0) 66%);
    opacity:.16;filter:blur(14px);
  }
  .bub::after{
    content:"";position:absolute;left:22%;top:14%;width:16%;height:11%;
    border-radius:50%;background:rgba(255,255,255,.95);
    filter:blur(4px);transform:rotate(-24deg);opacity:.65;
  }
  .bub .txt{
    position:relative;z-index:2;font-size:var(--fs,2.4vmin);line-height:1.3;
    color:rgba(255,255,255,.96);letter-spacing:.1em;
    text-shadow:0 0 10px rgba(0,0,0,.55),0 1px 5px rgba(0,0,0,.8),0 0 20px rgba(255,255,255,.22);
    padding:0 10%;text-align:center;font-weight:400;
  }
  .smoke{position:absolute;inset:16%;border-radius:50%;
    background:radial-gradient(circle at 42% 44%,rgba(255,255,255,.34),rgba(255,222,238,.14) 58%,rgba(255,255,255,0) 74%);
    filter:blur(9px);animation:swirl 16s ease-in-out infinite alternate;}

  @keyframes rise{
    0%{transform:translate3d(0,0,0);}
    100%{transform:translate3d(var(--dx,0px),var(--dy,-120vh),0);}
  }
  @keyframes sway{
    0%{transform:translateX(-1.4%) rotate(-1.2deg);}
    100%{transform:translateX(1.4%) rotate(1.2deg);}
  }
  /* 点击后炸开的那一屏：用过渡扩散，不用位移动画 */
  .b.bloom{
    animation:none;
    transition:left 1.15s cubic-bezier(.16,.84,.32,1),
               top 1.15s cubic-bezier(.16,.84,.32,1),
               opacity .7s ease,
               transform 1.15s cubic-bezier(.16,.84,.32,1);
  }
  .d{width:100%;height:100%;}
  .d.climb{animation:climb var(--climb,40s) linear forwards;}
  @keyframes climb{
    from{transform:translateY(0);}
    to{transform:translateY(var(--up,-40vh));}
  }
  .b.grow{animation:grow 1.6s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes grow{
    from{transform:scale(.55);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  /* 第六屏：从下方缓缓浮上来，停在原位悬着 */
  .b.drift{animation:driftUp var(--dur,12s) cubic-bezier(.25,.9,.3,1) forwards;}
  @keyframes driftUp{
    0%{transform:translate3d(0,var(--fromY,80vh),0);opacity:0;}
    55%{opacity:1;}
    100%{transform:translate3d(0,0,0);opacity:1;}
  }
  @keyframes swirl{
    0%{transform:rotate(0) scale(1);}
    100%{transform:rotate(26deg) scale(1.1);}
  }
  @keyframes tremble{
    0%{transform:translate(-.5%,.3%) rotate(-.5deg) scale(1.01);}
    100%{transform:translate(.6%,-.4%) rotate(.6deg) scale(.985);}
  }
  @keyframes squash{
    0%{border-radius:50% 50% 50% 50%/50% 50% 50% 50%;transform:scale(1.02,.98);}
    100%{border-radius:52% 48% 54% 46%/46% 54% 48% 52%;transform:scale(.97,1.03);}
  }
  .w.tremble{animation:tremble .17s linear infinite alternate;}
  .w.tremble .bub{animation:squash 1.1s ease-in-out infinite alternate;}

  /* 破裂 */
  .bub.popping{animation:pop .26s cubic-bezier(.2,.8,.4,1) forwards;}
  @keyframes pop{
    0%{transform:scale(1);opacity:1;filter:brightness(1);}
    42%{transform:scale(1.13);opacity:.95;filter:brightness(1.9);}
    100%{transform:scale(1.5);opacity:0;filter:brightness(2.2);}
  }
  .ring{
    position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.6);
    pointer-events:none;animation:ring .5s ease-out forwards;
  }
  @keyframes ring{
    0%{transform:scale(.9);opacity:.75;}
    100%{transform:scale(2.1);opacity:0;}
  }

  /* ---------- 文字 ---------- */
  .line{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);
    width:min(88vw,1400px);text-align:center;opacity:0;
    transition:opacity 1.5s ease,transform 1.6s cubic-bezier(.2,.7,.3,1);
    z-index:20;
    font-size:clamp(26px,5.4vmin,74px);
    font-weight:500;letter-spacing:.12em;line-height:1.7;
    color:#fff;text-shadow:0 0 50px rgba(255,190,225,.45),0 6px 40px rgba(0,0,0,.65);
  }
  .line::before{
    content:"";position:absolute;left:-16%;right:-16%;top:-40%;bottom:-40%;z-index:-1;
    background:radial-gradient(ellipse at center,rgba(5,3,8,.52) 0%,rgba(5,3,8,.22) 46%,rgba(5,3,8,0) 74%);
    filter:blur(18px);pointer-events:none;
  }
  .line.on{opacity:1;transform:translate(-50%,-50%);}
  .line.small{font-size:clamp(18px,3.2vmin,42px);letter-spacing:.2em;font-weight:400;}
  .line.tiny{font-size:clamp(14px,2.1vmin,26px);letter-spacing:.34em;font-weight:300;
    color:rgba(255,255,255,.62);text-shadow:0 0 30px rgba(0,0,0,.8);}
  .line.warm{
    color:#ffe6c2;
    text-shadow:0 0 70px rgba(255,180,90,.65),0 0 140px rgba(255,150,80,.35),0 6px 40px rgba(0,0,0,.7);
  }
  .line.late{font-size:clamp(20px,4.2vmin,58px);}
  .line + .line{margin-top:0;}

  /* 焦虑词 */
  .press{
    position:absolute;opacity:0;z-index:15;
    font-size:clamp(20px,3.4vmin,46px);letter-spacing:.3em;font-weight:600;
    color:#c6d3e6;text-shadow:0 0 28px rgba(0,0,0,.95),0 0 60px rgba(0,0,0,.85);
    transition:opacity 1.6s ease,transform 2.6s cubic-bezier(.2,.7,.3,1),filter 2s ease;
    filter:blur(2px);white-space:nowrap;
  }
  .press.on{opacity:.9;filter:blur(.2px);}
  .press.far{color:#8b9bb4;opacity:0;}

  /* 色雾 */
  .haze{
    position:absolute;inset:-10%;z-index:5;opacity:0;pointer-events:none;
    transition:opacity 3.2s ease;
    background:
      radial-gradient(circle at 24% 30%,rgba(255,110,174,.42),rgba(255,110,174,0) 46%),
      radial-gradient(circle at 76% 26%,rgba(106,168,255,.40),rgba(106,168,255,0) 48%),
      radial-gradient(circle at 52% 78%,rgba(255,194,71,.32),rgba(255,194,71,0) 50%),
      radial-gradient(circle at 18% 80%,rgba(143,208,255,.30),rgba(143,208,255,0) 44%);
    filter:blur(46px);
  }
  .haze.on{opacity:1;}

  /* 灯 */
  .lamp{
    position:absolute;left:50%;top:56%;width:130vmax;height:130vmax;
    transform:translate(-50%,-50%) scale(.4);opacity:0;
    background:radial-gradient(circle at 50% 50%,
      rgba(255,228,186,.55) 0%,
      rgba(255,186,110,.30) 9%,
      rgba(255,150,90,.13) 20%,
      rgba(180,120,200,.06) 36%,
      rgba(0,0,0,0) 62%);
    transition:opacity 3.4s ease,transform 5.5s cubic-bezier(.2,.7,.3,1);
    pointer-events:none;z-index:2;
  }
  .lamp.on{opacity:1;transform:translate(-50%,-50%) scale(1);}

  /* 全黑遮蔽 */
  .blackout{position:absolute;inset:0;background:#050308;opacity:0;
    transition:opacity 2.2s ease;pointer-events:none;z-index:30;}
  .blackout.on{opacity:1;}

  /* ---------- UI ---------- */
  .dots{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    display:flex;gap:10px;z-index:60;opacity:0;transition:opacity .4s ease;
  }
  .dots.show{opacity:.55;}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;
    transition:background .3s,transform .3s;}
  .dot.on{background:rgba(255,214,138,.95);transform:scale(1.5);}
  .hint{
    position:fixed;left:50%;bottom:44px;transform:translateX(-50%);
    font-size:12px;letter-spacing:.24em;color:rgba(255,255,255,.34);
    z-index:60;opacity:0;transition:opacity .8s ease;white-space:nowrap;
  }
  .hint.show{opacity:1;}
  @media (max-width:640px){
    .hint{bottom:38px;font-size:10px;letter-spacing:.12em;}
  }
</style>
</head>
<body>
<div id="stage">

  <!-- 1 · 一颗烟泡浮起，无字 -->
  <section class="scene" data-i="0">
    <div class="layer bl"></div>
  </section>

  <!-- 2 · 愿望一颗一颗生出来 -->
  <section class="scene" data-i="1">
    <div class="layer bl"></div>
  </section>

  <!-- 3 · 泡泡遮住光 -->
  <section class="scene" data-i="2">
    <div class="haze" id="haze3"></div>
    <div class="layer bl"></div>
    <div class="line" id="s3t">美好、轻盈，也格外脆弱</div>
  </section>

  <!-- 4 · 焦虑压进来 -->
  <section class="scene" data-i="3">
    <div class="layer bl"></div>
    <div class="layer pr"></div>
  </section>

  <!-- 5 · 破裂 -->
  <section class="scene" data-i="4">
    <div class="layer bl"></div>
  </section>

  <!-- 6 · 灯与落点 -->
  <section class="scene" data-i="5">
    <div class="lamp" id="lamp"></div>
    <div class="layer bl"></div>
    <div class="line warm late" id="s6a" style="top:38%;">那束光曾经亮过</div>
    <div class="line warm late" id="s6b" style="top:62%;z-index:21;">不必因为梦容易消散，就不敢拥有它</div>
  </section>

  <div class="vignette"></div>
</div>

<div class="dots" id="dots"></div>
<div class="hint" id="hint">空格 / → 继续　·　1–6 跳转　·　F 全屏　·　R 重播本屏</div>

<script>
(function(){
  "use strict";

  var stage = document.getElementById('stage');
  var scenes = [].slice.call(document.querySelectorAll('.scene'));
  var dotsBox = document.getElementById('dots');
  var hint = document.getElementById('hint');
  var cur = -1;
  var timers = [];

  var TINT = ['rgba(255,158,199,.44)','rgba(143,208,255,.44)','rgba(255,216,138,.40)'];
  var DREAMS = ['考驾照','过四级','打一场比赛','加入社团','学一门乐器','进实验室',
                '读完那本书','学会游泳','做自媒体','做兼职','去很远的地方','看一次海',
                '办一场自己的展','拿一次奖学金','做一个小项目','站上舞台',
                '把作业做成作品','攒钱去旅行','坚持写日记','成为想成为的人'];
  var s2main = null, s2burst = false, survivorGeo = [];

  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function rnd(a, b){ return a + Math.random() * (b - a); }

  // 字越长，泡越大、字越小，保证一行装得下
  function sizeFor(word){
    var n = word.length;
    return n <= 4 ? rnd(12.5, 15) : (n <= 6 ? rnd(15.5, 18) : rnd(17, 19.5));
  }
  function fsFor(size, word){
    var n = word.length;
    var per = n;
    function calc(p){ return Math.min(size * 0.22, (size * 0.74) / (p * 1.12)); }
    var fs = calc(per);
    if (fs < 1.7 && n > 3){ per = Math.ceil(n / 2); fs = calc(per); }  // 一行太挤就排两行
    return Math.max(1.05, fs);
  }

  // 在给定区域里找一个尽量不撞别人、又不像网格的位置
  function bestSpot(size, placed, xr, yr, gap){
    var asp = window.innerWidth / Math.max(1, window.innerHeight);
    var cands = [];
    for (var x = xr[0]; x <= xr[1]; x += 6){
      for (var y = yr[0]; y <= yr[1]; y += 6.5){
        cands.push({ x: x + rnd(-2.6, 2.6), y: y + rnd(-2.8, 2.8) });
      }
    }
    for (var i = cands.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = cands[i]; cands[i] = cands[j]; cands[j] = t;
    }
    var best = cands[0], bestD = -1e9;
    for (var c = 0; c < cands.length; c++){
      var cx = cands[c].x, cy = cands[c].y, minD = 1e9;
      for (var k = 0; k < placed.length; k++){
        var ox = (cx - placed[k].x) * asp, oy = cy - placed[k].y;
        var d = Math.sqrt(ox * ox + oy * oy) - (size + placed[k].s) / 2;
        if (d < minD) minD = d;
      }
      if (minD >= gap){ best = cands[c]; bestD = minD; break; }
      if (minD > bestD){ bestD = minD; best = cands[c]; }
    }
    placed.push({ x: best.x, y: best.y, s: size });
    return best;
  }

  // 造一颗泡泡：x/y 用 vw/vh 百分比
  function bubble(opt){
    var o = opt || {};
    var size = o.size || 14;          // vmin
    var el = document.createElement('div');
    el.className = 'b';
    el.style.width = size + 'vmin';
    el.style.height = size + 'vmin';
    el.style.left = (o.x != null ? o.x : rnd(4, 92)) + '%';
    el.style.top = (o.y != null ? o.y : 108) + '%';
    el.style.setProperty('--tint', o.tint || TINT[Math.floor(Math.random()*3)]);
    el.style.setProperty('--dur', (o.dur || rnd(16, 26)) + 's');
    el.style.setProperty('--delay', (o.delay || 0) + 'ms');
    el.style.setProperty('--dx', (o.dx || rnd(-40, 40)) + 'px');
    el.style.setProperty('--dy', (o.dy || -(110 + rnd(0, 60))) + 'vh');
    el.style.setProperty('--sway', (o.sway || rnd(6, 11)) + 's');
    el.style.setProperty('--swayd', (-rnd(0, 6)) + 's');
    el.style.setProperty('--fs', (o.fs || size * 0.15) + 'vmin');

    var w = document.createElement('div');
    w.className = 'w';
    var b = document.createElement('div');
    b.className = 'bub';
    if (o.smoke){
      var s = document.createElement('div');
      s.className = 'smoke';
      b.appendChild(s);
    }
    if (o.text){
      var t = document.createElement('div');
      t.className = 'txt';
      t.textContent = o.text;
      b.appendChild(t);
    }
    w.appendChild(b);
    var d = document.createElement('div');
    d.className = 'd';
    d.appendChild(w);
    el.appendChild(d);
    if (o.parent){ o.parent.appendChild(el); }
    return { root: el, d: d, wrap: w, bub: b };
  }

  function clearLayers(sc){
    [].slice.call(sc.querySelectorAll('.layer')).forEach(function(l){ l.innerHTML = ''; });
  }

  function resetReveals(sc){
    [].slice.call(sc.querySelectorAll('.line')).forEach(function(l){
      l.classList.remove('on');
      l.style.opacity = '';
    });
    [].slice.call(sc.querySelectorAll('.haze')).forEach(function(l){ l.classList.remove('on'); });
    [].slice.call(sc.querySelectorAll('.lamp')).forEach(function(l){ l.classList.remove('on'); });
    [].slice.call(sc.querySelectorAll('.blackout')).forEach(function(l){ l.classList.remove('on'); });
  }

  /* ---------- 各场景 ---------- */
  var builders = [
    // 1 一颗烟泡，缓慢浮起
    function(sc){
      var bl = sc.querySelector('.bl');
      var b = bubble({ x: 46, y: 104, size: 30, smoke: true,
                       tint: 'rgba(255,170,210,.62)', dur: 30, dx: 6, dy: -122, fs: 0 });
      b.root.style.setProperty('--sway', '13s');
      bl.appendChild(b.root);
    },

    // 2 一颗烟泡，点它才炸开二十个梦想
    function(sc){
      var bl = sc.querySelector('.bl');
      s2burst = false;
      s2main = bubble({ x: 50, y: 45, size: 26, smoke: true,
                        tint: 'rgba(255,170,210,.6)', dur: 40, dx: 0, dy: 0, fs: 0 });
      s2main.root.className = 'b bloom';
      s2main.root.style.left = 'calc(50% - 13vmin)';
      s2main.root.style.top = 'calc(45% - 13vmin)';
      s2main.root.style.setProperty('--sway', '12s');
      bl.appendChild(s2main.root);
    },

    // 3 泡泡挤满，遮住光
    function(sc){
      var bl = sc.querySelector('.bl');
      var haze = sc.querySelector('.haze');
      var t = sc.querySelector('.line');
      for (var i = 0; i < 34; i++){
        (function(i){
          later(function(){
            var b = bubble({
              x: rnd(-6, 94),
              y: rnd(28, 108),
              size: rnd(9, 22),
              dur: rnd(28, 46),
              dx: rnd(-50, 50),
              dy: -(14 + rnd(0, 26)),
              fs: 0
            });
            bl.appendChild(b.root);
          }, i * 95);
        })(i);
      }
      later(function(){ haze.classList.add('on'); }, 700);
      later(function(){ t.classList.add('on'); }, 2600);
    },

    // 4 焦虑从边缘压进来，泡泡发抖
    function(sc){
      var bl = sc.querySelector('.bl');
      var pr = sc.querySelector('.pr');
      for (var i = 0; i < 26; i++){
        (function(i){
          later(function(){
            var b = bubble({
              x: rnd(6, 90),
              y: rnd(20, 96),
              size: rnd(8, 18),
              dur: rnd(30, 48),
              dx: rnd(-30, 30),
              dy: -(10 + rnd(0, 20)),
              fs: 0
            });
            b.root.style.setProperty('--delay', '0ms');
            bl.appendChild(b.root);
            setTimeout(function(){ b.wrap.classList.add('tremble'); }, 600 + i * 60);
          }, i * 70);
        })(i);
      }

      var words = [
        ['绩点', 34, 12], ['保研', 6, 30], ['实习', 78, 22], ['压力', 12, 74],
        ['焦虑', 84, 62], ['迷茫', 44, 88], ['错失', 62, 6]
      ];
      words.forEach(function(w, i){
        later(function(){
          var el = document.createElement('div');
          el.className = 'press';
          el.textContent = w[0];
          el.style.left = w[1] + '%';
          el.style.top = w[2] + '%';
          var ox = w[1] < 40 ? -5 : (w[1] > 62 ? 5 : 0);
          var oy = w[2] < 24 ? -5 : (w[2] > 76 ? 5 : 0);
          el.style.transform = 'translate(' + ox + 'vw,' + oy + 'vh) scale(1.18)';
          pr.appendChild(el);
          setTimeout(function(){
            el.classList.add('on');
            el.style.transform = 'translate(0,0) scale(1)';
          }, 40);
        }, 500 + i * 700);
      });
    },

    // 5 一颗接一颗破掉，越来越密，最后留零星几颗
    function(sc){
      var bl = sc.querySelector('.bl');
      var list = [];
      for (var i = 0; i < 30; i++){
        var b = bubble({
          x: rnd(2, 80), y: rnd(26, 90), size: rnd(10, 22),
          dur: 60, dx: rnd(-20, 20), dy: -(8 + rnd(0, 14)), fs: 0
        });
        bl.appendChild(b.root);
        list.push(b);
      }
      // 随机留 5 颗不破
      var keep = {};
      while (Object.keys(keep).length < 5){
        keep[Math.floor(rnd(0, list.length))] = 1;
      }
      var order = [];
      list.forEach(function(_, i){ if (!keep[i]) order.push(i); });
      order.sort(function(){ return Math.random() - .5; });

      var idx = 0, wait = 900;
      (function fire(){
        if (idx >= order.length){
          later(function(){ captureSurvivors(list, keep); }, 800);
          return;
        }
        later(function(){
          popIt(list[order[idx]], bl);
          idx++;
          wait = Math.max(55, wait * 0.86);
          fire();
        }, wait);
      })();
    },

    // 6 只剩灯的暖光，两句话，50 颗新泡泡二次生长并停住
    function(sc){
      var lamp = sc.querySelector('.lamp');
      var bl = sc.querySelector('.bl');
      var a = document.getElementById('s6a');
      var b2 = document.getElementById('s6b');
      later(function(){ lamp.classList.add('on'); }, 200);
      later(function(){ a.classList.add('on'); }, 2600);
      later(function(){ a.style.opacity = '0'; }, 6400);
      later(function(){ b2.classList.add('on'); }, 7000);

      // 20 句话打乱，每句最多用一次，不靠重复凑数
      var words = DREAMS.slice();
      for (var w = words.length - 1; w > 0; w--){
        var jw = Math.floor(Math.random() * (w + 1));
        var tw = words[w]; words[w] = words[jw]; words[jw] = tw;
      }

      var asp = window.innerWidth / Math.max(1, window.innerHeight);
      var placed = [];

      // 把画面切成格子，每颗泡泡各占一格，整屏铺开，不往中间挤
      function cellSpots(cols, rows, xr, yr){
        var out = [], cw = (xr[1] - xr[0]) / cols, ch = (yr[1] - yr[0]) / rows;
        for (var c = 0; c < cols; c++){
          for (var r = 0; r < rows; r++){
            out.push({
              x: xr[0] + cw * (c + 0.5) + rnd(-cw * 0.3, cw * 0.3),
              y: yr[0] + ch * (r + 0.5) + rnd(-ch * 0.3, ch * 0.3)
            });
          }
        }
        for (var i = out.length - 1; i > 0; i--){
          var j = Math.floor(Math.random() * (i + 1));
          var t = out[i]; out[i] = out[j]; out[j] = t;
        }
        return out;
      }
      // 带字的：上面 4×3 + 下面 4×1，左右上下都摊开，中间那句留空
      var labelCells = cellSpots(4, 3, [6, 94], [9, 47])
                        .concat(cellSpots(4, 1, [6, 94], [71, 85]));
      // 不带字的：7×5 铺满整块屏幕
      var fillCells = cellSpots(7, 5, [3, 96], [5, 93]);
      var labelIdx = 0, fillIdx = 0;

      function takeSpot(cell, size, gap){
        var p = { x: cell.x, y: cell.y };
        for (var t = 0; t < 12; t++){
          var ok = true;
          for (var i = 0; i < placed.length; i++){
            var ox = (p.x - placed[i].x) * asp, oy = p.y - placed[i].y;
            if (Math.sqrt(ox * ox + oy * oy) < (size + placed[i].s) / 2 + gap){ ok = false; break; }
          }
          if (ok) break;
          p = { x: cell.x + rnd(-6, 6), y: cell.y + rnd(-5, 5) };
        }
        placed.push({ x: p.x, y: p.y, s: size });
        return p;
      }

      // 1) 第五屏留下的那几颗，就地长成新的梦想（同位置，像从里面长出来）
      var geo = survivorGeo.slice(0, 4).map(function(g){
        // 别让带字的泡压在落点那句上
        return { x: g.x, y: (g.y > 51 && g.y < 71) ? (g.y < 61 ? 49 : 73) : g.y, size: g.size };
      });
      // 给幸存的那几颗留出位置，别的字泡不往那儿挤
      labelCells = labelCells.filter(function(c){
        for (var i = 0; i < geo.length; i++){
          var ox = (c.x - geo[i].x) * asp, oy = c.y - geo[i].y;
          if (Math.sqrt(ox * ox + oy * oy) < 18) return false;
        }
        return true;
      });
      geo.forEach(function(g, i){
        placed.push({ x: g.x, y: g.y, s: 15 });
        later(function(){
          var word = words[i % words.length];
          var size = Math.max(13.5, Math.min(17, g.size * 1.05));
          var b = bubble({ x: g.x, y: g.y, size: size, text: word,
                           tint: TINT[i % 3], dur: 90, dx: 0, dy: 0,
                           fs: fsFor(size, word) });
          b.root.className = 'b grow';
          b.root.style.left = 'calc(' + g.x.toFixed(2) + '% - ' + (size / 2) + 'vmin)';
          b.root.style.top = 'calc(' + g.y.toFixed(2) + '% - ' + (size / 2) + 'vmin)';
          bl.appendChild(b.root);
        }, 8400 + i * 420);
      });
      // 旧的那层跟着淡掉，新泡接手
      later(function(){ scenes[4].classList.add('fade'); }, 8200);

      // 2) 其余 46 颗从下方浮上来，悬停不破；约 1/3 带字，其余只给密度和光
      var rest = 50 - geo.length;
      var labelLeft = Math.max(0, 16 - geo.length);
      for (var k = 0; k < rest; k++){
        (function(k){
          later(function(){
            var hasText = k < labelLeft;
            var word = hasText ? words[geo.length + k] : '';
            var size = hasText ? rnd(12, 15) : rnd(5.5, 9.5);
            var p = hasText
              ? takeSpot(labelCells[labelIdx++ % labelCells.length], size, 1.6)
              : takeSpot(fillCells[fillIdx++ % fillCells.length], size, 0.2);
            var b = bubble({ x: p.x, y: p.y, size: size, text: word || null,
                             tint: TINT[(k + 1) % 3], dur: rnd(9, 13), dx: 0, dy: 0,
                             fs: fsFor(size, word || '') });
            b.root.className = 'b drift';
            b.root.style.left = 'calc(' + p.x.toFixed(2) + '% - ' + (size / 2) + 'vmin)';
            b.root.style.top = 'calc(' + p.y.toFixed(2) + '% - ' + (size / 2) + 'vmin)';
            b.root.style.setProperty('--fromY', (72 + rnd(0, 30)).toFixed(0) + 'vh');
            bl.appendChild(b.root);
          }, 8600 + k * 115);
        })(k);
      }
    }
  ];

  // 点开第二屏：以中央那颗为中心炸出二十个梦想
  function burstDreams(sc){
    if (s2burst) return;
    s2burst = true;
    var bl = sc.querySelector('.bl');
    var m = s2main;
    if (m){
      m.bub.classList.add('popping');
      setTimeout(function(){
        if (m.root.parentNode){ m.root.parentNode.removeChild(m.root); }
      }, 320);
      s2main = null;
    }
    var placed = [];
    DREAMS.forEach(function(word, i){
      later(function(){
        var size = sizeFor(word);
        var p = bestSpot(size, placed, [7, 93], [9, 80], 1.6);
        var cx = p.x, cy = p.y;
        var mx = (cx - 50).toFixed(2), my = (cy - 45).toFixed(2);
        var b = bubble({ x: 50, y: 45, size: size, text: word, tint: TINT[i % 3],
                         dur: 60, dx: 0, dy: 0, fs: fsFor(size, word) });
        b.root.className = 'b bloom';
        b.root.style.left = 'calc(50% - ' + (size / 2) + 'vmin)';
        b.root.style.top = 'calc(45% - ' + (size / 2) + 'vmin)';
        b.root.style.opacity = '0';
        bl.appendChild(b.root);
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            b.root.style.opacity = '1';
            b.root.style.left = 'calc(50% - ' + (size / 2) + 'vmin + ' + mx + 'vw)';
            b.root.style.top = 'calc(45% - ' + (size / 2) + 'vmin + ' + my + 'vh)';
          });
        });
        later(function(){
          b.d.style.setProperty('--up', '-' + rnd(46, 76).toFixed(0) + 'vh');
          b.d.style.setProperty('--climb', rnd(36, 54).toFixed(0) + 's');
          b.d.classList.add('climb');
        }, 1300);
      }, i * 70);
    });
  }

  // 记录第五屏幸存泡泡的位置，给第六屏接上
  function captureSurvivors(list, keep){
    survivorGeo = [];
    var W = window.innerWidth, H = window.innerHeight, U = Math.min(W, H);
    Object.keys(keep).forEach(function(k){
      var b = list[+k];
      if (!b || !b.root.parentNode) return;
      var r = b.root.getBoundingClientRect();
      if (!r.width) return;
      var cx = (r.left + r.width / 2) / W * 100;
      var cy = (r.top + r.height / 2) / H * 100;
      // 贴着边的那几颗，位置收进画面里，新泡才看得见
      cx = Math.min(90, Math.max(10, cx));
      cy = Math.min(86, Math.max(14, cy));
      survivorGeo.push({ x: cx, y: cy, size: r.width / U * 100 });
    });
  }

  function popIt(b, layer){
    if (!b || b.bub.dataset.popped) return;
    b.bub.dataset.popped = '1';
    var r = b.root.getBoundingClientRect();
    var ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.left = (r.left + r.width / 2 - r.width * 0.42) + 'px';
    ring.style.top = (r.top + r.height / 2 - r.height * 0.42) + 'px';
    ring.style.width = (r.width * 0.84) + 'px';
    ring.style.height = (r.height * 0.84) + 'px';
    stage.appendChild(ring);
    setTimeout(function(){ ring.remove(); }, 560);
    b.bub.classList.add('popping');
    setTimeout(function(){ b.root.style.visibility = 'hidden'; }, 260);
  }

  /* ---------- 导航 ---------- */
  function dots(){
    dotsBox.innerHTML = '';
    scenes.forEach(function(_, i){
      var d = document.createElement('div');
      d.className = 'dot';
      d.onclick = function(e){ e.stopPropagation(); go(i); };
      dotsBox.appendChild(d);
    });
  }

  function paintDots(){
    [].slice.call(dotsBox.children).forEach(function(d, i){
      d.classList.toggle('on', i === cur);
    });
  }

  function go(i){
    if (i < 0 || i >= scenes.length || i === cur) return;
    var carry = (cur === 4 && i === 5);   // 第五屏残余跟着进第六屏
    clearTimers();
    if (cur >= 0){
      var old = scenes[cur];
      old.classList.remove('active');
      if (carry){
        old.classList.remove('fade');
        old.classList.add('linger');
      } else {
        old.classList.remove('linger');
        old.classList.remove('fade');
        setTimeout(function(){
          if (!old.classList.contains('active') && !old.classList.contains('linger')){
            clearLayers(old);
            resetReveals(old);
          }
        }, 950);
      }
    }
    // 残余只在第六屏期间保留
    if (i !== 5 && i !== 4 && scenes[4].classList.contains('linger')){
      var left = scenes[4];
      left.classList.remove('linger');
      left.classList.remove('fade');
      setTimeout(function(){
        if (!left.classList.contains('active') && !left.classList.contains('linger')){
          clearLayers(left);
          resetReveals(left);
        }
      }, 950);
    }
    cur = i;
    var sc = scenes[i];
    sc.classList.remove('linger');
    sc.classList.remove('fade');
    clearLayers(sc);
    resetReveals(sc);
    sc.classList.add('active');
    try { history.replaceState(null, '', '#' + (i + 1)); } catch(err){}
    // 强制重排，保证动画从头播
    void sc.offsetWidth;
    builders[i](sc);
    hint.textContent = (i === 1 && !s2burst)
      ? '点一下泡泡 · 或按空格　—　让它散开'
      : '空格 / → 继续　·　1–6 跳转　·　F 全屏　·　R 重播本屏';
    paintDots();
    if (i > 0) flashHint();
  }

  function next(){ if (cur < scenes.length - 1) go(cur + 1); }
  function prev(){ if (cur > 0) go(cur - 1); }

  var hintTimer;
  function flashHint(){
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){ hint.classList.remove('show'); }, 3200);
  }

  function toggleFull(){
    var el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement){
      (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  }

  document.addEventListener('keydown', function(e){
    var k = e.key;
    if (k === ' ' || k === 'Enter'){
      e.preventDefault();
      if (cur === 1 && !s2burst){ burstDreams(scenes[1]); return; }
      next();
    } else if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown'){
      e.preventDefault(); next();
    } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace'){
      e.preventDefault(); prev();
    } else if (k === 'f' || k === 'F'){
      toggleFull();
    } else if (k === 'r' || k === 'R'){
      var c = cur; cur = -1; go(c);
    } else if (k >= '1' && k <= '6'){
      go(parseInt(k, 10) - 1);
    } else if (k === 'Escape'){
      hint.classList.remove('show');
      dotsBox.classList.remove('show');
    }
  });

  stage.addEventListener('click', function(e){
    if (e.target.classList.contains('dot')) return;
    if (cur === 1 && !s2burst){ burstDreams(scenes[1]); return; }
    next();
  });

  var uiTimer;
  function showUI(){
    dotsBox.classList.add('show');
    hint.classList.add('show');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(function(){
      dotsBox.classList.remove('show');
      hint.classList.remove('show');
    }, 3600);
  }
  document.addEventListener('mousemove', showUI);
  document.addEventListener('touchstart', showUI, {passive: true});

  dots();
  var startAt = parseInt((location.hash || '').replace('#', ''), 10);
  go(!isNaN(startAt) && startAt >= 1 ? Math.min(startAt - 1, scenes.length - 1) : 0);
  setTimeout(showUI, 600);
})();
</script>
</body>
